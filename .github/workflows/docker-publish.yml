name: Build and publish Docker image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
      version:
        type: string
        default: test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: linux-arm64
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}-${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
          provenance: false

      - name: Test backup tools as non-root
        run: |
          for uid in 65532 10001; do
            docker run --rm \
              --user "$uid:$uid" \
              --read-only \
              --network none \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --tmpfs /tmp:rw,nosuid,nodev,noexec,size=128m \
              --volume "$GITHUB_WORKSPACE/tests:/tests:ro" \
              --entrypoint sh \
              "$IMAGE" /tests/smoke.sh
          done

      - name: Push tested image
        if: ${{ inputs.publish }}
        run: docker push "$IMAGE"

  merge:
    name: Publish multi-architecture manifest
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and latest tags
        run: |
          docker buildx imagetools create \
            -t "$REGISTRY/$IMAGE_NAME:$VERSION" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            "$REGISTRY/$IMAGE_NAME:$VERSION-linux-amd64" \
            "$REGISTRY/$IMAGE_NAME:$VERSION-linux-arm64"

      - name: Add image information to release
        uses: actions/github-script@v9
        with:
          script: |
            const version = process.env.VERSION;
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}`;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: `v${version}`
            });
            const marker = '<!-- container-image -->';
            const body = (release.body || '').split(marker)[0].trimEnd();
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              body: `${body}\n\n${marker}\n## Container image\n\n` +
                `Image: \`${image}:${version}\`\n\n` +
                `Platforms: \`linux/amd64\`, \`linux/arm64\`.\n\n` +
                `Pull: \`docker pull ${image}:${version}\`\n\n` +
                `The \`${image}:latest\` tag points to this release.`
            });
